# Nginx Reverse Proxy Configuration for license.skmnetwork.com
# Internal Upstream: Fastify License Server on 127.0.0.1:3100 (Isolated Port)

server {
    listen 80;
    listen [::]:80;
    server_name license.skmnetwork.com;

    # Allow Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other HTTP traffic to HTTPS (once SSL certificate is installed)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name license.skmnetwork.com;

    # SSL Certificate Paths (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/license.skmnetwork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/license.skmnetwork.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Request size limit (License JSON payloads are small)
    client_max_body_size 2M;

    # Reverse proxy to Fastify License Server on isolated port 3100
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Proxy Timeouts
        proxy_connect_timeout 15s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        # Disable buffering for low-latency JSON responses
        proxy_buffering off;
    }

    # Block access to hidden files and SQLite database files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(db|sqlite|sqlite3)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
